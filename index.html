<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zenve CRM Center — Unified Enterprise Portal</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><circle cx='12' cy='12' r='10'/></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <!-- Fullscreen Dashboard Viewport (100vw x 100vh) -->
  <main class="app-viewport">
    
    <!-- Top Navigation Bar (Theme Switcher) -->
    <header class="top-navbar">
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle visual theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Header Spacing Area (Preserves Full Visibility of Zenve Logo & CRM Center Banner in Background) -->
    <div class="header-spacing-area" aria-label="Zenve CRM Center">
      <h1 class="visually-hidden">Zenve CRM Center</h1>
    </div>

    <!-- 6 CRM Cards Container (Exactly 3 Columns x 2 Rows Grid) -->
    <section class="crm-grid-container" aria-label="Zenve CRM Applications">
      <div id="crm-cards-grid" class="crm-cards-grid">
        <!-- Exactly 6 cards rendered dynamically from js/config.js via js/app.js -->
        <noscript>
          <div style="color: #ffffff; text-align: center; grid-column: 1/-1; padding: 20px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
            Please enable JavaScript to access the CRM Center Portal.
          </div>
        </noscript>
      </div>
    </section>

    <!-- Bottom Spacing Area (Shows Scenic Pathway & Garden Flowers) -->
    <div class="bottom-spacing-area"></div>

  </main>

  <!-- Configuration File (Centralized URL Source) -->
  <script src="js/config.js"></script>

  <!-- Master App Controller -->
  <script src="js/app.js"></script>

</body>
</html>
