<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRM Logins — Choose Your CRM</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><circle cx='12' cy='12' r='10'/></svg>">
  
  <!-- Preconnect & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <!-- Background Canvas Floating Bubble Engine -->
  <div class="background-canvas-wrap">
    <canvas id="particle-canvas"></canvas>
  </div>

  <!-- Master 100vh Viewport Container (Zero Scrolling) -->
  <main class="app-viewport">
    
    <!-- Top Navigation Bar -->
    <header class="top-navbar">
      <!-- Portal Brand Left: "CRM Logins" with Soft Blue Floating Glowing Paw Decorative Effect -->
      <div class="nav-brand-group">
        <!-- Subtle blurred soft blue glowing paw effect behind the text -->
        <div class="brand-glow-backdrop" aria-hidden="true">
          <div class="soft-blue-glow-blob"></div>
          <svg class="floating-paw-decor" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="softBluePawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
                <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#818cf8" stop-opacity="0.45" />
              </linearGradient>
              <filter id="softPawBlurGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <!-- Main Paw Pad -->
            <path d="M24 20C18.5 20 15 25 15.5 30C16 34.5 19.5 38 24 38C28.5 38 32 34.5 32.5 30C33 25 29.5 20 24 20Z" fill="url(#softBluePawGrad)" filter="url(#softPawBlurGlow)"/>
            <!-- 4 Toe Beans -->
            <ellipse cx="14" cy="18" rx="3.5" ry="5" transform="rotate(-24 14 18)" fill="url(#softBluePawGrad)" filter="url(#softPawBlurGlow)"/>
            <ellipse cx="20.5" cy="13" rx="3.5" ry="5.5" transform="rotate(-8 20.5 13)" fill="url(#softBluePawGrad)" filter="url(#softPawBlurGlow)"/>
            <ellipse cx="27.5" cy="13" rx="3.5" ry="5.5" transform="rotate(8 27.5 13)" fill="url(#softBluePawGrad)" filter="url(#softPawBlurGlow)"/>
            <ellipse cx="34" cy="18" rx="3.5" ry="5" transform="rotate(24 34 18)" fill="url(#softBluePawGrad)" filter="url(#softPawBlurGlow)"/>
          </svg>
        </div>

        <span class="nav-brand-title">CRM Logins</span>
      </div>

      <!-- Controls Right: Theme Toggle -->
      <div class="nav-controls-group">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle visual theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Center Hero Section -->
    <section class="hero-section">
      <h1 class="hero-main-title">Choose Your CRM</h1>
      <div class="hero-accent-pill"></div>
      <p class="hero-subtitle">Select a CRM to log in and get started.</p>
    </section>

    <!-- CRM 5-Card Launcher Grid (Compact, No Empty Gaps) -->
    <section class="crm-grid-container" aria-label="Zenve CRM Applications">
      <div id="crm-cards-grid" class="crm-cards-grid">
        <!-- Rendered dynamically from js/config.js via js/app.js -->
        <noscript>
          <div style="color: #0f172a; text-align: center; grid-column: 1/-1; padding: 20px;">
            Please enable JavaScript to access the CRM Logins Portal.
          </div>
        </noscript>
      </div>
    </section>

    <!-- Bottom Spacing Anchor (Preserves clean room for pet silhouettes) -->
    <div class="bottom-spacer"></div>

  </main>

  <!-- Configuration File (Centralized URL Source) -->
  <script src="js/config.js"></script>

  <!-- Canvas Particles Engine (Bubbles) -->
  <script src="js/particles.js"></script>

  <!-- Master App & Interactive 3D Physics -->
  <script src="js/app.js"></script>

</body>
</html>
